name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test with diagnostics
        timeout-minutes: 6
        run: |
          node --version
          npm --version
          printf 'CI=%s GITHUB_ACTIONS=%s RUNNER_OS=%s RUNNER_ARCH=%s\n' \
            "${CI:-unset}" "${GITHUB_ACTIONS:-unset}" "${RUNNER_OS:-unset}" "${RUNNER_ARCH:-unset}"
          printf 'Event=%s Run ID=%s Attempt=%s Workspace=%s\n' \
            "${GITHUB_EVENT_NAME:-unset}" "${GITHUB_RUN_ID:-unset}" "${GITHUB_RUN_ATTEMPT:-unset}" "${GITHUB_WORKSPACE:-unset}"
          uname -a
          nproc
          free -h
          df -h .

          set +e
          timeout --preserve-status --signal=TERM 300s npm test
          test_status=$?

          if [ "$test_status" -eq 124 ] || [ "$test_status" -eq 137 ] || [ "$test_status" -eq 143 ]; then
            echo "npm test did not complete before the timeout; collecting process diagnostics"
            ps -ef
            ps -ef | grep -E '[n]ode --test|[M]ongoMemoryServer|[m]ongod|[m]ongo_killer' || true
          fi

          exit "$test_status"

      - name: Verify generated artifacts
        run: git diff --exit-code
