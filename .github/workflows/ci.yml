name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test with diagnostics
        timeout-minutes: 6
        run: |
          node --version
          npm --version
          printf 'CI=%s GITHUB_ACTIONS=%s RUNNER_OS=%s RUNNER_ARCH=%s\n' \
            "${CI:-unset}" "${GITHUB_ACTIONS:-unset}" "${RUNNER_OS:-unset}" "${RUNNER_ARCH:-unset}"
          printf 'Event=%s Run ID=%s Attempt=%s Workspace=%s\n' \
            "${GITHUB_EVENT_NAME:-unset}" "${GITHUB_RUN_ID:-unset}" "${GITHUB_RUN_ATTEMPT:-unset}" "${GITHUB_WORKSPACE:-unset}"
          uname -a
          nproc
          free -h
          df -h .

          set +e
          timeout --preserve-status --signal=TERM 300s npm test -- --test-concurrency=1 &
          test_pid=$!

          (
            sleep 240
            if kill -0 "$test_pid" 2>/dev/null; then
              echo "npm test is still running after 240 seconds; collecting live diagnostics"
              echo "Full process tree:"
              ps -eo pid,ppid,pgid,sid,stat,etime,args --forest
              echo "Node test runners and workers:"
              pgrep -af 'node.*--test|test/.*\.test\.js' || true
              echo "MongoDB test processes:"
              pgrep -af 'MongoMemoryServer|mongod|mongo_killer' || true
              echo "Listening TCP sockets and owning processes:"
              ss -lntp || true
            fi
          ) &
          diagnostics_pid=$!

          wait "$test_pid"
          test_status=$?
          kill "$diagnostics_pid" 2>/dev/null || true
          wait "$diagnostics_pid" 2>/dev/null || true

          if [ "$test_status" -eq 124 ] || [ "$test_status" -eq 137 ] || [ "$test_status" -eq 143 ]; then
            echo "npm test did not complete before the 300-second timeout"
          fi

          exit "$test_status"

      - name: Verify generated artifacts
        run: git diff --exit-code
