# Development-only overrides. Production uses docker-compose.yml alone.
services:
    app:
        environment:
            NODE_ENV: development
            BASE_URL: ${DEV_BASE_URL:-http://localhost:3000}
            # TLS is expected to terminate upstream in production. Local
            # development intentionally serves plain HTTP without certificates.
            FORCE_HTTPS: 'false'
            # Local login returns an on-page magic link instead of attempting
            # delivery through production SMTP credentials.
            MAIL_TRANSPORT: ''
