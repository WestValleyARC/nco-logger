# hamlive-oss — complete local/self-hosted application stack.
#
#   docker compose up -d --build
#   docker compose logs -f app
#   docker compose down       # data persists in the named volume
#
# This runs a SINGLE-NODE REPLICA SET. A replica set (not a standalone mongod)
# is required for MongoDB change streams, which power Ham.Live's real-time
# (SSE) updates. The healthcheck below auto-initiates the replica set on first
# start, so there's nothing extra to run.
#
# Your MONGODB_URI must include ?directConnection=true (the .env.example default
# already does). For a hosted instance, point MONGODB_URI at a managed database
# (e.g. MongoDB Atlas), which is already a replica set.

services:
    app:
        build:
            context: .
            target: runtime
            args:
                APP_REVISION: ${APP_REVISION:-workspace}
        image: ${NCO_APP_IMAGE:-westvalleyarc/nco-logger:dev}
        restart: unless-stopped
        env_file:
            - ${NCO_ENV_FILE:-.env}
        environment:
            NODE_ENV: production
            PORT: 3000
            MONGODB_URI: ${MONGODB_COMPOSE_URI:-mongodb://${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}@mongo:27017/hamlive?authSource=hamlive&replicaSet=rs0&directConnection=true}
        ports:
            # Bind only to the host loopback interface. The production reverse
            # proxy can reach this port without exposing Node directly.
            - '${APP_BIND_IP:-127.0.0.1}:${APP_HOST_PORT:-3000}:3000'
        depends_on:
            mongo:
                condition: service_healthy
        networks:
            hamlive:
            frontend:
                aliases:
                    - nco-logger-app
        volumes:
            - hamlive-chat-uploads:/app/data/chat-uploads
        read_only: true
        tmpfs:
            - /tmp:mode=1777,size=64m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '5'
        deploy:
            resources:
                limits:
                    memory: 768m
                    cpus: '1.5'
        healthcheck:
            test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
            interval: 30s
            timeout: 5s
            start_period: 20s
            retries: 3
        develop:
            watch:
                # Hand-maintained runtime JS and generated browser assets can
                # be synchronized into the same-server development container.
                # Restarting recalculates asset fingerprints and reloads routes.
                - action: sync+restart
                  path: ./server/dist
                  target: /app/server/dist
                - action: sync+restart
                  path: ./client/dist
                  target: /app/client/dist
                # Source-only edits need a full image build so TypeScript is
                # compiled before the browser receives it.
                - action: rebuild
                  path: ./client/src
                - action: rebuild
                  path: ./package.json
                - action: rebuild
                  path: ./package-lock.json
                - action: rebuild
                  path: ./Dockerfile

    backup:
        profiles: ['operations']
        build:
            context: .
            dockerfile: Dockerfile.backup
        image: ${NCO_BACKUP_IMAGE:-westvalleyarc/nco-logger-backup:dev}
        user: ${NCO_BACKUP_UID:-1000}:${NCO_BACKUP_GID:-1000}
        environment:
            MONGODB_PRODUCTION_URI: ${MONGODB_COMPOSE_URI:-mongodb://${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}@mongo:27017/hamlive?authSource=hamlive&replicaSet=rs0&directConnection=true}
            MONGODB_DEVELOPMENT_URI: ${MONGODB_DEVELOPMENT_URI:-}
            HAMLIVE_BACKUP_DIR: /backups
            HAMLIVE_UPLOAD_DIR: /uploads
        depends_on:
            mongo:
                condition: service_healthy
        networks:
            - hamlive
        volumes:
            - ${NCO_BACKUP_DIR:-./backups}:/backups
            - hamlive-chat-uploads:/uploads
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL

    backup-scheduler:
        profiles: ['scheduled-backup']
        build:
            context: .
            dockerfile: Dockerfile.backup
        image: ${NCO_BACKUP_IMAGE:-westvalleyarc/nco-logger-backup:dev}
        entrypoint: ['/usr/local/bin/backup-scheduler']
        restart: unless-stopped
        user: ${NCO_BACKUP_UID:-1000}:${NCO_BACKUP_GID:-1000}
        environment:
            MONGODB_PRODUCTION_URI: ${MONGODB_COMPOSE_URI:-mongodb://${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}@mongo:27017/hamlive?authSource=hamlive&replicaSet=rs0&directConnection=true}
            HAMLIVE_BACKUP_DIR: /backups
            HAMLIVE_UPLOAD_DIR: /uploads
            NCO_BACKUP_INTERVAL_SECONDS: ${NCO_BACKUP_INTERVAL_SECONDS:-900}
            NCO_BACKUP_RETENTION_DAYS: ${NCO_BACKUP_RETENTION_DAYS:-30}
            NCO_BACKUP_S3_BUCKET: ${NCO_BACKUP_S3_BUCKET:-}
            NCO_BACKUP_S3_PREFIX: ${NCO_BACKUP_S3_PREFIX:-hamlive}
        depends_on:
            mongo:
                condition: service_healthy
        networks:
            - hamlive
        volumes:
            - ${NCO_BACKUP_DIR:-./backups}:/backups
            - hamlive-chat-uploads:/uploads:ro
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '5'

    mongo:
        image: mongo:7@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
        restart: unless-stopped
        entrypoint: ['/opt/hamlive/mongo-entrypoint.sh']
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
            MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME}
            MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}
            MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY}
        volumes:
            - hamlive-mongo-data:/data/db
            - mongo-config:/data/configdb
            - ./scripts/docker/mongo-entrypoint.sh:/opt/hamlive/mongo-entrypoint.sh:ro
            - ./scripts/docker/create-app-user.js:/docker-entrypoint-initdb.d/create-app-user.js:ro
        networks:
            - hamlive
        healthcheck:
            # Initiate the replica set once the node is up (no-op once initiated).
            test: ['CMD-SHELL', "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"try { quit(rs.status().ok ? 0 : 1) } catch (e) { try { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) } catch (_) {} quit(1) }\""]
            interval: 10s
            timeout: 10s
            start_period: 20s
            retries: 10

volumes:
    hamlive-mongo-data:
    mongo-config:
    hamlive-chat-uploads:

networks:
    hamlive:
        driver: bridge
    frontend:
        external: ${FRONTEND_NETWORK_EXTERNAL:-true}
        name: ${FRONTEND_NETWORK_NAME:-westvalleyarc_frontend}
